# use C-a, since it's on the home row and easier to hit than C-b
set -g prefix C-a
unbind-key C-a
bind-key C-a send-prefix
set -g base-index 1

# Easy config reload
bind-key R source-file ~/.config/tmux/tmux.conf \; display-message "Config @ ~/.config/tmux/tmux.conf reloaded."

# vi is good
setw -g mode-keys vi

# mouse behavior
setw -g mouse on

set-option -g default-terminal "xterm-ghostty"
set -as terminal-overrides ",xterm-256color:RGB"

bind-key : command-prompt
bind-key r refresh-client\; display-message "Client Refreshed"
bind-key L clear-history\; display-message "History Cleared"

bind-key space next-window
bind-key bspace previous-window
bind-key enter next-layout

# use vim-like keys for splits and windows
bind-key v split-window -h
bind-key s split-window -v
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

bind-key -r C-h resize-pane -L 10
bind-key -r C-j resize-pane -D 10
bind-key -r C-k resize-pane -U 10
bind-key -r C-l resize-pane -R 10

bind-key C-o rotate-window

bind-key + select-layout main-horizontal
bind-key = select-layout main-vertical

setw -g other-pane-height 25
setw -g other-pane-width 80
setw -g display-panes-time 1500

bind-key a last-pane
bind-key q display-panes
bind-key c new-window
bind-key t next-window
bind-key T previous-window

bind-key [ copy-mode
bind-key ] paste-buffer

# Setup 'v' to begin selection as in Vim
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "reattach-to-user-namespace pbcopy"

# Update default binding of `Enter` to also use copy-pipe
unbind -T copy-mode-vi Enter
bind-key -T copy-mode-vi Enter send -X copy-pipe-and-cancel "reattach-to-user-namespace pbcopy"

# Status Bar
set -g status-style "bg=#1e2030,fg=#c0caf5"
set -g status-left-length 40
set -g status-left "#[bold]#S #[default]"
set -g status-left-style "fg=white"
set -g status-right "#h | %H:%M %d-%b "
set -q status-right-style "fg=black,bg=green,bold"
setw -g window-status-format " #I:#W#F "
setw -g window-status-current-format " #I:#W#F "
setw -g window-status-current-style "bg=orange,fg=#1e2030,bold"
setw -g window-status-separator ""
set -g pane-active-border-style "fg=black,bg=yellow"
set -g pane-border-indicators off
set -g pane-border-status bottom
set -g status-position top

# Set window notifications
setw -g monitor-activity on
set -g visual-activity both

# Allow the arrow key to be used immediately after changing windows
set-option -g repeat-time 0

#history
set-option -g history-limit 1000000
